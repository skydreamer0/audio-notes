<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="audio-token" content="PREVIEW-NO-SERVER"><title>Audio Notes · 聲音成為筆記</title><style>:root{font-family:Inter,"Noto Sans TC",system-ui,sans-serif;color:#243d37;background:#f5f6f0;font-synthesis:none}*{box-sizing:border-box}body{margin:0}main{max-width:1180px;margin:auto;padding:28px 32px}header,.heading,.actions{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{color:inherit;font-weight:750;font-size:22px;text-decoration:none}.pill{font-size:12px;border:1px solid #cfd8cc;border-radius:30px;padding:8px 14px}.intro{padding:48px 0 32px}.eyebrow{letter-spacing:.17em;font-size:12px;color:#6a8270}h1{font-size:clamp(32px,5vw,52px);line-height:1.25;margin:16px 0;letter-spacing:-.04em}.intro>p:last-child{color:#728278}.workspace{display:grid;grid-template-columns:360px 1fr;gap:22px}.panel{border:1px solid #e0e5d9;background:#fffefa;border-radius:20px;padding:24px;box-shadow:0 6px 28px #26392905}h2{font-size:15px;letter-spacing:.03em;margin:0 0 22px}h2 small{font-size:10px;font-weight:400;color:#81917e}.drop{display:flex;flex-direction:column;align-items:center;gap:12px;border:1px dashed #b9c7b5;border-radius:12px;padding:32px 8px;background:#f4f7ef;cursor:pointer}.drop.over{border-color:#176b51;background:#e8f3df}.upload{font-size:30px;color:#5c8069}.drop span,.drop small{color:#7a8878;font-size:12px}.drop input{max-width:240px;margin-top:12px}#filename{font-size:12px;overflow-wrap:anywhere}.consent{display:flex;gap:6px;font-size:12px;line-height:1.6;margin:18px 0}button{border:0;background:#2f654d;color:white;border-radius:9px;padding:11px 16px;cursor:pointer;font-weight:600}button:disabled{opacity:.4;cursor:not-allowed}button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #dfab47;outline-offset:3px}.secondary,.actions button{background:#edf1e7;color:#415c47}#start{width:100%}#cancel{margin-top:10px}.note,aside,.summary p{font-size:12px;color:#7c8777;line-height:1.7}aside{border-top:1px solid #e9ecdf;margin-top:20px;padding-top:18px}.heading h2{margin:0}.heading span{font-size:11px;color:#788972}.transcript{min-height:260px;max-height:480px;overflow:auto;margin:20px 0}.empty{text-align:center;color:#94a08e;padding:66px 5px}.empty>span{font-size:32px}.empty small{font-size:11px}.segment{display:grid;grid-template-columns:80px 1fr;gap:14px;border-bottom:1px solid #edf0e5;padding:12px 0}.segment time{font-size:11px;color:#82967b}.segment p{font-size:14px;line-height:1.7;margin:0;white-space:pre-wrap}.actions{justify-content:flex-start;flex-wrap:wrap}.actions button{font-size:11px}.summary{margin-top:28px;padding-top:22px;border-top:1px solid #e9ecdf}.summary h2{margin-bottom:8px}.summary li{font-size:13px;line-height:1.8;margin-bottom:12px}footer{font-size:11px;color:#95a08e;padding:25px 0}#status{max-width:65%;overflow-wrap:anywhere}[hidden]{display:none!important}@media(max-width:760px){main{padding:20px 16px}.workspace{grid-template-columns:1fr}.intro{padding:30px 0 20px}.pill{font-size:10px}.panel{padding:20px}.segment{grid-template-columns:65px 1fr}}
</style></head><body><main><header><a class="brand" href="/">◉ Audio Notes</a><span class="pill">本機優先 · 靜態版面預覽</span></header><section class="intro"><p class="eyebrow">給值得留下的對話</p><h1>把聲音，<br>整理成清楚的筆記。</h1><p>錄音匯入、逐字稿與重點整理。你的資料，由你掌握。</p></section><div class="workspace"><section class="panel"><h2>01　匯入錄音</h2><label class="drop" id="drop"><span class="upload">↥</span><strong>拖曳音檔到這裡</strong><span>或點一下選擇檔案</span><small>MP3 · M4A · WAV ／ 最多 100 MiB、2 小時</small><input id="file" type="file" accept=".mp3,.m4a,.wav,audio/*"></label><p id="filename">尚未選擇音檔</p><label class="consent"><input type="checkbox" id="consent">我有權處理這份錄音，並已取得必要同意。</label><button id="start" disabled>開始轉錄</button><button id="cancel" class="secondary" hidden>取消工作</button><p id="engine" class="note">版面預覽：請依 README 啟動服務使用轉錄功能。</p><aside>原音處理後即刪除。逐字稿只暫存在服務記憶體，關閉前請匯出。沒有自動雲端上傳。</aside></section><section class="panel result"><div class="heading"><h2>02　逐字稿</h2><span id="status" role="status" aria-live="polite">等待錄音</span></div><div id="transcript" class="transcript"><div class="empty"><span>≋</span><p>每一段內容，都能回到時間點。</p><small>轉錄完成後會顯示在這裡，不使用假逐字稿。</small></div></div><div class="actions"><button data-export="txt" disabled>TXT</button><button data-export="md" disabled>Markdown</button><button data-export="srt" disabled>SRT 字幕</button><button id="delete" class="secondary" hidden>刪除本筆</button></div><section class="summary"><h2>03　重點整理 <small>選配</small></h2><p>主動送往這台電腦的 Ollama，附逐字稿引用。未設定模型時不會執行。</p><button id="summary" class="secondary" disabled>同意使用本機 Ollama 整理</button><div id="summary-result"></div></section></section></div><footer>只聽你選擇的內容。不錄製麥克風，不讀取聊天室。</footer></main></body></html>
