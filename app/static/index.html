<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="audio-token" content="__TOKEN__"><title>Audio Notes · 聲音成為筆記</title><link rel="stylesheet" href="/static/style.css"></head><body><main><header><a class="brand" href="/">◉ Audio Notes</a><span class="pill">本機優先 · 原型 v0.1</span></header><section class="intro"><p class="eyebrow">給值得留下的對話</p><h1>把聲音，<br>整理成清楚的筆記。</h1><p>錄音匯入、逐字稿與重點整理。你的資料，由你掌握。</p></section><div class="workspace"><section class="panel"><h2>01　匯入錄音</h2><label class="drop" id="drop"><span class="upload">↥</span><strong>拖曳音檔到這裡</strong><span>或點一下選擇檔案</span><small>MP3 · M4A · WAV ／ 最多 100 MiB、2 小時</small><input id="file" type="file" accept=".mp3,.m4a,.wav,audio/*"></label><p id="filename">尚未選擇音檔</p><label class="consent"><input type="checkbox" id="consent">我有權處理這份錄音，並已取得必要同意。</label><button id="start">開始轉錄</button><button id="cancel" class="secondary" hidden>取消工作</button><p id="engine" class="note">正在檢查本機引擎…</p><aside>原音處理後即刪除。逐字稿只暫存在服務記憶體，關閉前請匯出。沒有自動雲端上傳。</aside></section><section class="panel result"><div class="heading"><h2>02　逐字稿</h2><span id="status" role="status" aria-live="polite">等待錄音</span></div><div id="transcript" class="transcript"><div class="empty"><span>≋</span><p>每一段內容，都能回到時間點。</p><small>轉錄完成後會顯示在這裡，不使用假逐字稿。</small></div></div><div class="actions"><button data-export="txt" disabled>TXT</button><button data-export="md" disabled>Markdown</button><button data-export="srt" disabled>SRT 字幕</button><button id="delete" class="secondary" hidden>刪除本筆</button></div><section class="summary"><h2>03　重點整理 <small>選配</small></h2><p>主動送往這台電腦的 Ollama，附逐字稿引用。未設定模型時不會執行。</p><button id="summary" class="secondary" disabled>同意使用本機 Ollama 整理</button><div id="summary-result"></div></section></section></div><footer>只聽你選擇的內容。不錄製麥克風，不讀取聊天室。</footer></main><script src="/static/app.js"></script></body></html>
